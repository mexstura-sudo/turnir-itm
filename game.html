<style>
/* Layout: игровой пульт — сверху табло игрока, под ним карта-граф сети техникума и панель выбранного узла */
.wrap.game{max-width:760px}
.hud{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;background:var(--lcd-bg);color:var(--lcd);border-radius:10px;padding:10px 12px;box-shadow:inset 0 0 0 2px #2b4a33;position:sticky;top:env(safe-area-inset-top,0px);z-index:6}
.hud small{display:block;font:700 .75rem var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:#bfe8c6}
.hud b{font:600 1.15rem var(--font-display);letter-spacing:.04em}
.hud-who{display:flex;gap:10px;align-items:center;min-width:0}
.hud-who>div{min-width:0}
.hud-who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-en b{color:#ffcf3f;text-shadow:0 0 6px rgba(255,207,63,.6)}
.hud-en,.hud-day{text-align:right}
.hud-crew{display:block;font-size:.68rem;opacity:.75;white-space:nowrap}
.hud-crew.on{color:#86f29a;opacity:1;font-weight:700}
.hud-en.happy{position:relative;border-radius:10px;padding:2px 8px;margin:-2px -8px;background:rgba(255,198,26,.14);box-shadow:0 0 0 2px #ffc61a,0 0 18px rgba(255,198,26,.55);animation:happy 1.6s ease-in-out infinite}
.hud-en.happy>small:first-child{color:#ffd23f!important}
.hud-en.happy b{color:#ffe45c;text-shadow:0 0 10px rgba(255,228,92,.9)}
.hud-en.happy .hud-sub{color:#ffe45c!important}
@keyframes happy{50%{box-shadow:0 0 0 2px #ffc61a,0 0 30px rgba(255,198,26,.85)}}
@media (prefers-reduced-motion:reduce){.hud-en.happy{animation:none}}
.swatch{display:inline-block;flex:none;width:16px;height:16px;border-radius:4px;border:2px solid #2b2a22;vertical-align:-3px}
.notice{position:relative;display:flex;align-items:center;background:linear-gradient(#ffe45c,#ffc61a);color:#1d1b12;border:2px solid #1d1b12;border-radius:10px;padding:10px 44px 10px 24px;box-shadow:0 3px 0 #1d1b12,0 0 0 0 rgba(255,198,26,.7);overflow:hidden;animation:nt-glow 2.4s ease-in-out 3}
.notice::before{content:'';position:absolute;left:0;top:0;bottom:0;width:12px;background:repeating-linear-gradient(-45deg,#1d1b12 0 6px,#ffc61a 6px 12px)}
.notice p{margin:0;font:600 .98rem/1.35 var(--font-body)}
.notice b{font:var(--display-w) 1.08rem var(--font-display);letter-spacing:var(--display-ls);text-transform:uppercase;color:#b3200e}
.nt-x{position:absolute;top:4px;right:4px;width:36px;height:36px;border:0;background:none;color:#1d1b12;font:700 1.5rem/1 var(--font-body);cursor:pointer;border-radius:6px}
.nt-x:hover{background:rgba(0,0,0,.08)}
@keyframes nt-glow{50%{box-shadow:0 3px 0 #1d1b12,0 0 0 6px rgba(255,198,26,.45)}}
@media (prefers-reduced-motion:reduce){.notice{animation:none}}
.event{display:flex;flex-direction:column;gap:2px;background:var(--paper);border:2px solid var(--bevel-lo);border-left:8px solid var(--accent);border-radius:8px;padding:10px 12px}
.ev-lbl{font:700 .72rem var(--font-body);letter-spacing:.14em;text-transform:uppercase;color:var(--accent-dk)}
.event b{font:var(--display-w) 1.1rem var(--font-display);letter-spacing:var(--display-ls);text-transform:uppercase}
.demo-codes{display:flex;gap:6px;flex-wrap:wrap}
.banner button{min-height:36px;padding:6px 10px}
/* событие дня: на телефоне свёрнуто в одну строку */
details.event>summary{list-style:none;cursor:pointer;display:flex;flex-direction:column;gap:2px;position:relative;padding-right:26px}
details.event>summary::-webkit-details-marker{display:none}
details.event>summary::after{content:'';position:absolute;right:2px;top:50%;width:9px;height:9px;border-right:2.5px solid var(--accent-dk);border-bottom:2.5px solid var(--accent-dk);transform:translateY(-70%) rotate(45deg);transition:transform .2s}
details.event[open]>summary::after{transform:translateY(-30%) rotate(-135deg)}
details.event[open]>summary{margin-bottom:4px}
.mycode{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.mycode b{font:700 1.15rem var(--font-mono);letter-spacing:.08em;user-select:all;-webkit-user-select:all}
.gtabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.gtabs .key{padding:8px 4px;font-size:.85rem}
.mapcol{display:flex;flex-direction:column;gap:10px}
.mapwrap{position:relative;background:#f4ecd4;border:2px solid var(--bevel-lo);border-radius:14px;overflow:hidden;box-shadow:inset 0 0 0 4px #efe5c6,0 3px 0 rgba(0,0,0,.12);
  background-image:linear-gradient(rgba(143,134,104,.13) 1px,transparent 1px),linear-gradient(90deg,rgba(143,134,104,.13) 1px,transparent 1px),linear-gradient(rgba(143,134,104,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(143,134,104,.07) 1px,transparent 1px);background-size:80px 80px,80px 80px,16px 16px,16px 16px}
.netmap{display:block;width:100%;aspect-ratio:3/4;max-height:76vh;max-height:72svh;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
@media (min-width:700px){.netmap{aspect-ratio:1/1}.map-sheet{right:auto;width:360px}.map-sheet.hint{width:auto;right:8px}}
.netmap:active{cursor:grabbing}
.reg-lbl{font:600 10px var(--font-display);letter-spacing:.12em;pointer-events:none}
.reg-tag{pointer-events:none}
.plan{pointer-events:none}
.p-chalk{font:600 7.5px var(--font-mono);fill:#e9dfc0}
.p-sign{font:600 11px var(--font-display);letter-spacing:.3em;fill:#6a6452}
.tch{font:600 .62rem var(--font-body);font-style:normal;letter-spacing:.06em;text-transform:uppercase;background:#c99a06;color:#fff;border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:1px}
.standings li.teach:not(.me){background:#f7ecc4}
.base-lbl{font:600 9px var(--font-display);letter-spacing:.05em;fill:#fbf6e6;pointer-events:none}
.bdg-n{font:700 7px var(--font-mono);fill:#fbf6e6;pointer-events:none}
.bdg{pointer-events:none}
.nd.cut{opacity:.75}
/* карту двигают — декоративные анимации стоят (вспышки событий в .fx не трогаем) */
.netmap.moving .plan *,.netmap.moving .lyr *{animation:none!important}
.reach{animation:reach 1.2s linear infinite}
@keyframes reach{to{stroke-dashoffset:-14}}
.bob{animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-1.8px)}}
.my-edge{stroke-dasharray:10 6;animation:flow 1.4s linear infinite}
@keyframes flow{to{stroke-dashoffset:-32}}
.mybase{animation:reach 1.4s linear infinite;stroke-dasharray:6 4}
.reticle{transform-box:fill-box;transform-origin:center;animation:ret 3s linear infinite}
@keyframes ret{to{transform:rotate(90deg)}}
.beam{animation:beam .5s ease-out forwards,beamfade 1.2s ease-in forwards}
@keyframes beam{to{stroke-dashoffset:0}}
@keyframes beamfade{0%,55%{opacity:1}100%{opacity:0}}
.ripple{transform-box:fill-box;transform-origin:center;animation:ripple 1.1s ease-out forwards}
@keyframes ripple{from{transform:scale(1);opacity:1}to{transform:scale(4);opacity:0}}
.map-chip{position:absolute;left:8px;top:8px;display:flex;gap:8px;align-items:center;background:rgba(14,29,19,.92);color:#bfe8c6;border-radius:999px;padding:6px 12px 6px 8px;font-size:.78rem;max-width:calc(100% - 70px)}

.map-chip span:last-child{white-space:nowrap}
.mapctl{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
.mbtn{width:38px;height:38px;border-radius:10px;border:2px solid var(--key-dk);background:linear-gradient(var(--bevel-hi),var(--key));color:var(--ink);font:700 1.15rem var(--font-body);box-shadow:0 2px 0 var(--key-dk);cursor:pointer;display:grid;place-items:center;padding:0}
.mbtn:active{transform:translateY(2px);box-shadow:none}
.map-sheet{position:absolute;left:8px;right:8px;bottom:8px;background:var(--paper);border:2px solid var(--ink);border-radius:12px;box-shadow:0 6px 16px rgba(0,0,0,.25)}
.map-sheet.hint{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:4px;padding:8px 12px;font-size:.9rem;border-width:1.5px;border-color:var(--bevel-lo);background:rgba(251,246,230,.95);box-shadow:none}
.map-sheet.open{padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px;animation:sheetin .22s ease-out}
@keyframes sheetin{from{transform:translateY(20px);opacity:0}}
.sh-x{position:absolute;right:6px;top:4px;border:0;background:none;font:700 1.4rem var(--font-body);color:var(--muted);cursor:pointer;width:34px;height:34px}
.sh-top{display:flex;gap:10px;align-items:center;padding-right:30px}
.sh-ico{flex:none;width:40px;height:40px;display:grid;place-items:center;background:#efe5c6;border-radius:10px}
.sh-txt{flex:1;min-width:0}
.sh-txt b{display:block;font:var(--display-w) 1.15rem var(--font-display);letter-spacing:.03em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-meta{display:flex;gap:10px;align-items:center;font-size:.85rem;color:var(--muted)}
.sh-why{margin:0;font-size:.9rem}
.roster-btn{padding:10px 14px;font-size:.95rem}.roster-btn small{font-weight:400;letter-spacing:0;text-transform:none}
.roster-head{display:flex;gap:10px;align-items:center}.roster-head h2{margin:0}

.roster-list li{padding:6px 4px;border-bottom:1px dashed var(--line)}.roster-list li span{display:inline-block;min-width:60%}.roster-list li b{float:right;font-weight:600;color:var(--muted)}
.roster-list li.me{font-weight:700;color:var(--accent-dk)}
.np-acts .btn{display:flex;justify-content:center;align-items:baseline;gap:6px;padding:12px 14px}
.np-acts .btn small{font:600 .8rem var(--font-body);letter-spacing:0;text-transform:none;opacity:.9}
.btn-atk{background:linear-gradient(#e2533b,#c2381f);border-color:#8a2412;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18),0 3px 0 #8a2412}
.mini{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;font:700 .85rem/1 var(--font-body);font-style:normal;color:#fff;border:1.5px solid #2b2a22;vertical-align:-3px}
.mini.plus{background:#1971c2}.mini.atk{background:#e03131}
.coach{border-color:var(--accent-dk)}
.coach h3{font-size:1.1rem}
.coach-steps{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px;font-size:.95rem}
.legend-sheet{max-height:calc(100vh - 40px);max-height:calc(100dvh - 40px);overflow-y:auto;overscroll-behavior:contain}
.lg-row{display:flex;gap:12px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}
.lg-row:last-of-type{border-bottom:0}
.lg-ico{flex:none;width:46px;height:46px;display:grid;place-items:center;background:#efe5c6;border-radius:10px}
.lg-row b{display:block;font:var(--display-w) .98rem var(--font-display);letter-spacing:.03em;text-transform:uppercase}
.lg-row span:not(.lg-ico){font-size:.88rem;color:var(--muted)}
.toast.alarm{background:#4a140c;color:#ffd2c4;border-color:#c2381f}
.nodepanel{background:var(--paper);border:2px solid var(--bevel-lo);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;min-height:64px}
.np-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.np-head b{display:block;font:var(--display-w) 1.2rem var(--font-display);letter-spacing:.03em;text-transform:uppercase;margin-top:4px}
.np-val{font:700 .85rem var(--font-mono);background:var(--lcd-bg);color:var(--lcd);border-radius:4px;padding:3px 8px;white-space:nowrap}
.np-shields{display:flex;gap:6px;align-items:center;font-size:.9rem}
.np-shields i{width:18px;height:18px;border-radius:50%;border:2px dashed var(--key-dk)}
.np-shields i.on{background:var(--blue);border-style:solid;border-color:#0f2440}
.np-acts{display:flex;flex-direction:column;gap:8px}
.hack-modal{place-items:center;overflow-y:auto}
.hack{max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);overflow-y:auto;overscroll-behavior:contain}
.hack-head{display:flex;justify-content:space-between;gap:8px;align-items:center}
.result{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:10px 0}
.result p{margin:0}
.res-icon{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;font:700 2.4rem var(--font-display);color:#fff}
.result.ok .res-icon{background:var(--ok);box-shadow:0 0 0 6px rgba(47,138,70,.2)}
.result.no .res-icon{background:var(--bad);box-shadow:0 0 0 6px rgba(194,56,31,.2)}
.rank{display:flex;flex-direction:column;gap:14px}
.standings{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.standings li{display:grid;grid-template-columns:2.2ch auto minmax(0,1fr) minmax(50px,30%) 4ch;gap:8px;align-items:center;padding:5px 6px;border-radius:6px;font-variant-numeric:tabular-nums}
.standings li.me{background:#f5c79e;font-weight:700}
.st-n{font:700 .85rem var(--font-mono);color:var(--muted)}
.st-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-name small{color:var(--muted);font-weight:400}
.st-name .st-day{display:block;font-size:.74rem;color:var(--muted);font-weight:400;font-variant-numeric:tabular-nums}
@media (max-width:480px){.st-name small:not(.st-day){display:none}}
.st-bar{height:10px;background:var(--cell);border-radius:3px;overflow:hidden}
.st-bar i{display:block;height:100%}
.st-s{text-align:right;font:700 .95rem var(--font-mono)}
.netlog{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.netlog li{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:8px;align-items:baseline;padding:7px 4px;border-bottom:1px dashed var(--line);font-size:.92rem}
.netlog li.me{background:#e3ecd6}.netlog li.hit{background:#f8d9cf}
.lg-d{font:700 .72rem var(--font-mono);color:var(--muted);white-space:nowrap}
.toast{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;background:var(--lcd-bg);color:var(--lcd);border:2px solid var(--lcd-dim);border-radius:8px;padding:10px 14px;font-size:.88rem;max-width:calc(100vw - 32px);box-shadow:0 6px 18px rgba(0,0,0,.35);animation:toast 3.2s ease forwards}
@keyframes toast{0%{opacity:0;transform:translate(-50%,10px)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
.final .podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;align-items:end}
.pd{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--lcd-bg);color:#bfe8c6;border-radius:8px 8px 0 0;padding:10px 6px;text-align:center;font-size:.85rem}
.pd b{color:var(--lcd);font-family:var(--font-display);letter-spacing:.04em}
.pd i{font-style:normal;font-size:1.6rem}
.pd1{order:2;min-height:150px}.pd2{order:1;min-height:120px}.pd3{order:3;min-height:100px}
.code-in{font:700 1.4rem var(--font-mono)!important;letter-spacing:.12em;text-transform:uppercase;text-align:center}
.g-intro{align-items:center}
.net-art{flex:none;width:150px;height:auto}
.na-n{animation:nap 3.2s ease-in-out infinite}

.rule-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:560px){.rule-grid{grid-template-columns:minmax(0,1fr)}}
.rule-grid b{font:var(--display-w) 1rem var(--font-display);letter-spacing:.04em;text-transform:uppercase}
.rule-grid p{margin:2px 0 0;font-size:.92rem}
.hud-sub{display:block;font:500 .72rem var(--font-body)!important;letter-spacing:.02em!important;text-transform:none!important;color:#9fd3a9!important;white-space:nowrap;margin-top:1px}
.ev-hot{min-height:36px;margin-top:6px;align-self:flex-start;text-align:left;font:500 .88rem var(--font-body);color:var(--ink);background:#fff3c4;border:1.5px solid #e0a100;border-radius:8px;padding:6px 10px;cursor:pointer}
.ev-hot b{font:inherit;font-weight:700;text-transform:none;letter-spacing:0}
.hotring{transform-box:fill-box;transform-origin:center;animation:hotpulse 1.6s ease-in-out infinite}
@keyframes hotpulse{50%{transform:scale(1.18);opacity:.55}}
.np-val.hot{background:#ffcf3f;color:var(--ink)}
.cal{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.cal li{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;align-items:start;padding:8px;border-radius:8px;border:1.5px solid var(--line);background:var(--paper)}
.cal li>div{display:flex;flex-direction:column;gap:2px;font-size:.9rem}
.cal li>div b{font:var(--display-w) 1rem var(--font-display);letter-spacing:.03em;text-transform:uppercase}
.cal-d{display:flex;flex-direction:column;align-items:center;background:var(--lcd-bg);color:var(--lcd);border-radius:6px;padding:4px 0}
.cal-d b{font:600 1.3rem/1 var(--font-display)}.cal-d small{font:700 .72rem var(--font-body);text-transform:uppercase;letter-spacing:.1em;color:#bfe8c6}
.cal li.today{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.cal li.past{opacity:.7}
.cal li.locked>div{color:var(--muted)}.cal li.locked .cal-d{background:#5b574a;color:#e9dfc0}.cal li.locked .cal-d small{color:#c9c0a2}
.th-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}

.th-card{display:flex;flex-direction:column;gap:8px;background:var(--paper);border:2px solid var(--bevel-lo);border-radius:10px;padding:12px;min-width:0}

.brief{display:flex;flex-direction:column;gap:10px;max-height:calc(100vh - 40px);max-height:calc(100dvh - 40px);overflow-y:auto;overscroll-behavior:contain}

details.event>summary::after{transition:none}}
.st-name small.st-best{display:inline;color:#2f8a46;font-weight:700}
.final-two{display:flex;flex-direction:column;gap:4px;padding:10px 12px;border-radius:8px;background:rgba(47,138,70,.1)}
/* утренние анимации событий дня (как в трейлере) */
.fx-spark{opacity:0;transform-box:fill-box;transform-origin:center;animation:fxSpark .7s ease-out forwards}
@keyframes fxSpark{0%{opacity:0;transform:scale(.4)}25%{opacity:.95;transform:scale(1.25)}100%{opacity:0;transform:scale(1.9)}}
.fx-dark{opacity:0;animation:fxDark 3s linear forwards}
@keyframes fxDark{0%{opacity:0}6%{opacity:.6}9%{opacity:.1}14%{opacity:.65}18%{opacity:.15}24%,82%{opacity:.62}100%{opacity:0}}
.fx-nopower{font:700 26px/1 'IBM Plex Mono',ui-monospace,monospace;letter-spacing:.08em;fill:#ff5544;opacity:0;animation:fxBlink 3s steps(1) forwards}
@keyframes fxBlink{0%,22%{opacity:0}26%,36%,46%,56%,66%{opacity:1}31%,41%,51%,61%{opacity:.15}86%{opacity:1}100%{opacity:0}}
.fx-x{opacity:0;animation:fxX 3s linear forwards}
@keyframes fxX{0%{opacity:0}8%,16%,24%,32%{opacity:1}12%,20%,28%{opacity:.25}85%{opacity:1}100%{opacity:0}}
.fx-door{stroke-dashoffset:var(--len);animation:fxDoor 2.5s ease-out forwards}
@keyframes fxDoor{0%{stroke-dashoffset:var(--len);opacity:1}30%{stroke-dashoffset:0}85%{opacity:1}100%{stroke-dashoffset:0;opacity:0}}
.fx-dim{opacity:0;animation:fxDim 3.2s ease-in-out forwards}
@keyframes fxDim{0%{opacity:0}12%,85%{opacity:.6}100%{opacity:0}}
.fx-cone{opacity:0;mix-blend-mode:screen;animation:fxCone 3s ease-in-out forwards}
@keyframes fxCone{0%{opacity:0}15%,82%{opacity:.4}100%{opacity:0}}
.fx-spotring{opacity:0;transform-box:fill-box;transform-origin:center;animation:fxRing 2.8s ease-in-out forwards}
@keyframes fxRing{0%{opacity:0;transform:scale(2.2)}18%{opacity:1;transform:scale(1)}50%{transform:scale(1.15)}82%{opacity:1;transform:scale(1)}100%{opacity:0}}
.mapwrap.alarm::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:3;background:radial-gradient(ellipse at center,rgba(255,40,30,0) 30%,rgba(255,40,30,.62) 100%);animation:fxAlarm .5s ease-in-out 5 alternate both}
@keyframes fxAlarm{from{opacity:.15}to{opacity:1}}
/* аркады бесплатных действий */
.arcade{display:flex;flex-direction:column;gap:12px;align-items:stretch;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.ar-pins{display:flex;justify-content:center;gap:10px}
.ar-pin{width:16px;height:30px;border-radius:4px;background:#0e1d13;border:2px solid var(--ink,#2b2a22);transition:background .2s}
.ar-pin.on{background:#86f29a;box-shadow:0 0 10px rgba(134,242,154,.7)}
.ar-bar{position:relative;height:56px;border-radius:10px;background:#0e1d13;border:2px solid var(--ink,#2b2a22);overflow:hidden;cursor:pointer}
.ar-bar.miss{animation:arShake .35s}
.ar-zone{position:absolute;top:0;bottom:0;background:rgba(134,242,154,.35);border-left:2px solid #86f29a;border-right:2px solid #86f29a}
.ar-cur{position:absolute;top:4px;bottom:4px;width:6px;margin-left:-3px;border-radius:3px;background:#ffcf3f;box-shadow:0 0 8px #ffcf3f}
@keyframes arShake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.ar-time{align-self:center;font:700 20px/1 ui-monospace,monospace;padding:6px 12px;border-radius:8px;background:#0e1d13;color:#86f29a}
.ar-time.warn{color:#ff8a7a}
.ar-board{display:flex;align-items:stretch;justify-content:center;gap:4px}
.ar-side{display:grid;grid-template-rows:repeat(4,1fr);width:22px;font-size:18px;text-align:center;align-items:center;color:#2f8a46}
.ar-side .ar-src,.ar-side .ar-dst{font-weight:700}
.ar-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;width:min(100%,300px);padding:4px;border-radius:10px;background:#2b2a22}
.ar-grid.done{box-shadow:0 0 0 3px #86f29a}
.ar-tile{padding:0;border:0;background:none;aspect-ratio:1;cursor:pointer;border-radius:8px}
.ar-tile svg{display:block;width:100%;height:100%}
.ar-tile:focus-visible{outline:3px solid #ffcf3f}
.ar-prog{height:10px;border-radius:5px;background:#0e1d13;overflow:hidden;border:2px solid var(--ink,#2b2a22)}
.ar-prog i{display:block;height:100%;width:0;background:#86f29a}
.ar-stage{position:relative;border-radius:10px;overflow:hidden;border:2px solid var(--ink,#2b2a22)}
.ar-canvas{display:block;width:100%;height:260px;touch-action:none}
.ar-hint{position:absolute;inset:0;display:grid;place-items:center;color:#86f29a;font:700 18px/1.2 ui-monospace,monospace;background:rgba(14,29,19,.55);cursor:pointer}
</style>
