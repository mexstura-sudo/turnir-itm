<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" type="image/png" href="icon.png">
<title>Захват сети ИТМ — статистика игры</title>
<meta name="theme-color" content="#2f5a44">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Rubik:wght@400;500;700&family=IBM+Plex+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="style.css?v=20261113b">
<style>
/* Layout: одна колонка — график с выбором группы и её карточкой, табло с видео по дням, лента фактов, отзыв */
main{padding:16px max(12px,env(safe-area-inset-left,0px)) 40px}
.wrap.stats{max-width:1000px;gap:18px}
.sec-h{display:flex;flex-direction:column;gap:2px}
.sec-h h2{margin:0}
.sec-h p{margin:0}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tile{background:var(--lcd-bg);color:#bfe8c6;border-radius:8px;padding:10px 8px;text-align:center;box-shadow:inset 0 0 0 2px #2b4a33}
.tile b{display:block;font:600 clamp(1.3rem,5.5vw,2rem)/1.1 var(--font-display);color:var(--lcd);letter-spacing:.03em}
.tile small{font:700 .68rem var(--font-body);letter-spacing:.1em;text-transform:uppercase}
/* график */
.chart{position:relative;background:var(--paper);border:2px solid var(--line);border-radius:8px;padding:6px 4px 2px;touch-action:pan-y}
.chart svg{display:block;width:100%;height:auto;font-family:var(--font-mono)}
.tip{position:absolute;top:8px;pointer-events:none;background:var(--lcd-bg);color:#dff3e2;border-radius:8px;padding:8px 10px;font:500 .78rem/1.35 var(--font-mono);box-shadow:0 3px 10px rgba(0,0,0,.3);min-width:150px;z-index:2}
.tip b{display:block;color:var(--lcd);margin-bottom:4px}
.tip div{display:flex;gap:6px;align-items:center;white-space:nowrap}
.tip i{width:9px;height:9px;border-radius:50%;flex:none}
.tip span:last-child{margin-left:auto;padding-left:10px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font:500 .84rem var(--font-body);padding:6px 10px;border-radius:999px;border:2px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;min-height:36px}
.chip i{width:11px;height:11px;border-radius:50%;flex:none;box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip.more{border-style:dashed;color:var(--muted)}
/* карточка группы */
.team{display:flex;flex-direction:column;gap:12px;border-top:2px dashed var(--line);padding-top:14px}
.team-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.team-h i{width:20px;height:20px;border-radius:5px;box-shadow:0 0 0 2px var(--ink)}
.team-h b{font:600 1.6rem/1 var(--font-display);letter-spacing:.04em}
.team-h span{color:var(--muted)}
.kv{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.kv div{background:var(--cell);border-radius:6px;padding:8px 4px;text-align:center}
.kv b{display:block;font:700 1.15rem var(--font-mono)}
.kv small{font-size:.7rem;color:var(--muted);line-height:1.2;display:block}
.tbl-x{overflow-x:auto;max-width:100%;min-width:0}
.wrap.stats>*,.sheet,.team{min-width:0}
.days{width:100%;border-collapse:collapse;font:500 .84rem var(--font-mono);font-variant-numeric:tabular-nums;min-width:520px}
.days th{font-size:.68rem;text-transform:uppercase;letter-spacing:.04em;text-align:right;padding:6px 6px;border-bottom:2px solid var(--ink);color:var(--muted)}
.days th:first-child,.days td:first-child{text-align:left;white-space:nowrap}
.days td{text-align:right;padding:7px 6px;border-bottom:1px solid var(--grid)}
.days tfoot td{font-weight:700;border-top:2px solid var(--ink);border-bottom:0}
.notes{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
/* табло с видео */
.tv{background:linear-gradient(#45433a,#33312a);border:2px solid #1c1b17;border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:10px}
.tv video,.tv .tv-off{width:100%;aspect-ratio:16/9;border-radius:6px;background:#050a07;display:block;box-shadow:inset 0 0 0 3px #091209}
.tv .tv-off{display:flex;align-items:center;justify-content:center;text-align:center;color:var(--lcd);font:600 1.1rem var(--font-display);letter-spacing:.06em;text-transform:uppercase;padding:16px}
.tv-keys{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.tv-keys .key{padding:10px 2px;min-height:44px;cursor:pointer;font-size:clamp(.72rem,3.2vw,.92rem);letter-spacing:.02em;white-space:nowrap}
.tv-cap{color:#d9d2bd;font-size:.86rem;margin:0;text-align:center}
/* лента фактов */
.ribbon{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x proximity;padding:4px 2px 12px;margin:0 -2px;-webkit-overflow-scrolling:touch}
.fact{flex:0 0 210px;scroll-snap-align:start;background:var(--paper);border:2px solid var(--bevel-lo);border-radius:10px;box-shadow:inset 2px 2px 0 var(--bevel-hi),0 3px 0 rgba(0,0,0,.12);padding:14px 12px;display:flex;flex-direction:column;gap:4px}
.fact:nth-child(3n+1){background:var(--lcd-bg);border-color:#091209;box-shadow:inset 0 0 0 2px #2b4a33;color:#bfe8c6}
.fact:nth-child(3n+1) b{color:var(--lcd)}
.fact .ico{font-size:1.7rem;line-height:1}
.fact b{font:600 2rem/1.05 var(--font-display);letter-spacing:.02em}
.fact span{font-size:.86rem;line-height:1.3}
.fact small{font-size:.74rem;opacity:.75;line-height:1.3}
/* отзыв */
.stars{display:flex;gap:4px}
.stars button{font-size:2rem;line-height:1;background:none;border:0;padding:4px;cursor:pointer;filter:grayscale(1);opacity:.4;min-width:44px;min-height:44px}
.stars button.on{filter:none;opacity:1}
textarea{width:100%;min-height:90px;border:2px solid var(--line);border-radius:8px;padding:10px;font:inherit;background:var(--paper);color:var(--ink);resize:vertical}
.back{align-self:flex-start}
/* навигатор по странице */
.pnav{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:3px solid var(--panel-dark);padding:8px max(12px,env(safe-area-inset-left,0px))}
.pnav-in{max-width:1000px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}
.pnav a{min-width:0;white-space:normal;text-decoration:none;text-align:center;padding:8px 3px;min-height:44px;display:flex;align-items:center;justify-content:center;font-size:clamp(.62rem,2.7vw,.92rem);letter-spacing:.01em;line-height:1.1;hyphens:auto}
.pnav a[aria-current="true"]{background:linear-gradient(#2b4a33,var(--lcd-bg));color:var(--lcd);border-color:#091209}
section[id]{scroll-margin-top:76px}
/* личная статистика */
.me-form{display:flex;gap:8px;flex-wrap:wrap}
.me-form input{flex:1 1 220px;min-height:48px;border:2px solid var(--line);border-radius:8px;padding:10px 12px;font:600 1.05rem var(--font-mono);letter-spacing:.06em;text-transform:uppercase;background:var(--paper);color:var(--ink)}
.me-card{display:flex;flex-direction:column;gap:12px}
.me-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.me-h b{font:600 1.5rem/1.1 var(--font-display);letter-spacing:.03em}
.me-h span{color:var(--muted)}
.me-h i{width:18px;height:18px;border-radius:5px;box-shadow:0 0 0 2px var(--ink)}
.me-two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.me-box{background:var(--lcd-bg);color:#bfe8c6;border-radius:10px;padding:12px;box-shadow:inset 0 0 0 2px #2b4a33;display:flex;flex-direction:column;gap:6px}
.me-box h3{margin:0;font:700 .74rem var(--font-body);letter-spacing:.14em;text-transform:uppercase;color:#8fbf99}
.me-big{font:600 2.2rem/1 var(--font-display);color:var(--lcd)}
.me-box p{margin:0;font-size:.88rem}
.bars{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;align-items:end;height:120px;padding-top:6px}
.bars div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;height:100%;font:600 .78rem var(--font-mono)}
.bars i{display:block;width:70%;max-width:46px;border-radius:4px 4px 0 0;background:var(--accent);min-height:2px}
.bars small{font:600 .72rem var(--font-body);color:var(--muted)}
.me-list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px;font-size:.92rem}
@media (max-width:560px){.me-two{grid-template-columns:1fr}}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
/* задания олимпиады */
.tk-list{display:flex;flex-direction:column;gap:8px}
.tk{border:2px solid var(--line);border-radius:10px;background:var(--paper);overflow:hidden}
.tk[open]{border-color:var(--bevel-lo);box-shadow:0 3px 0 rgba(0,0,0,.1)}
.tk>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:10px 12px;min-height:56px}
.tk>summary::-webkit-details-marker{display:none}
.tk>summary:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.tk-name{font-weight:700;display:flex;gap:6px;align-items:baseline;min-width:0}
.tk-name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tk-name small{font-weight:500;color:var(--muted);white-space:nowrap}
.tk-meta{font:600 .82rem var(--font-mono);text-align:right;white-space:nowrap}
.tk-bar{grid-column:1/-1;height:8px;border-radius:4px;background:var(--cell);overflow:hidden}
.tk-bar i{display:block;height:100%;border-radius:4px}
.tk-body{padding:4px 12px 14px;display:flex;flex-direction:column;gap:12px;border-top:2px dashed var(--line)}
.tk-kv{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:10px}
.tk-kv div{background:var(--cell);border-radius:6px;padding:7px 4px;text-align:center}
.tk-kv b{display:block;font:700 1.02rem var(--font-mono)}
.tk-kv small{font-size:.68rem;color:var(--muted);line-height:1.2;display:block}
.tk-ex{background:var(--sheet);border:2px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:12px;min-width:0;max-width:620px;width:100%}
.tk-res{margin:0;font-weight:700}
.tk-res.ok{color:var(--ok)}.tk-res.no{color:var(--bad)}
@media (max-width:560px){.tk-kv{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.kv{grid-template-columns:repeat(3,minmax(0,1fr))}.fact{flex-basis:180px}}
</style>
</head>
<body>
<header class="masthead"><div class="masthead-in"><div class="lcd">Захват сети ИТМ · итоги</div></div></header>
<nav class="pnav" aria-label="Разделы страницы"><div class="pnav-in"><a class="key" href="#results">Результаты</a><a class="key" href="#tasks">Задания</a><a class="key" href="#video">Видео</a><a class="key" href="#feedback">Обратная связь</a><a class="key" href="#me">Личная статистика</a></div></nav>
<main><div class="wrap stats" id="app"><p class="muted">Загружаем статистику…</p></div></main>
<footer class="foot"><div class="foot-in"><span>ИТМ им. Н. П. Трапезникова</span><span>Иркутск · 2026</span></div></footer>

<script>
(function () {
  'use strict';

  const $app = document.getElementById('app');
  const code = (() => { try { return localStorage.getItem('zs_code'); } catch (e) { return null; } })();
  const REGIONS = ['Автомастерская', 'Сварочный цех', 'Серверная 1', 'Актовый зал', 'Швейный цех', 'Столовая', 'Учительская', 'Серверная 2', 'Серверная 3', 'Серверная 4'];

  let D = null, sel = null, showAll = false;

  // ---------- график: накопленные захваты (свободные узлы + отбитые у соперников) ----------
  function chart() {
    const T = D.teams, H = Math.round((Date.parse(D.end) - Date.parse(D.start)) / 3600e3), nowH = Math.min(H, Math.floor((Date.parse(D.at) - Date.parse(D.start)) / 3600e3));

    const path = (t) => t.cum.slice(0, nowH + 1).map((v, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1)).join('');
    const order = T.slice().sort((a, b) => (a.id === sel) - (b.id === sel) || top.includes(a.id) - top.includes(b.id));
    order.forEach((t) => { const hi = t.id === sel, on = hi || (top.includes(t.id) && (sel == null || true));
      svg.append(sv('path', { d: path(t), fill: 'none', stroke: on ? t.color : '#b7ae93', 'stroke-width': hi ? 4 : on ? 2 : 1, 'stroke-opacity': hi ? 1 : on ? (sel != null ? .55 : .95) : .55, 'stroke-linejoin': 'round', 'stroke-linecap': 'round', 'stroke-dasharray': on && !hi ? t.dash : null })); });
    // подписи справа: выбранная группа и лидеры (не больше четырёх, без наложений)
    const lab = T.filter((t) => t.id === sel || top.slice(0, 4).includes(t.id)).sort((a, b) => (b.id === sel) - (a.id === sel)).slice(0, 4).map((t) => ({ t, y: Y(t.cum[nowH]) })).sort((a, b) => a.y - b.y);

    const cross = sv('line', { y1: m.t - 8, y2: Ht - m.b, stroke: '#2b2a22', 'stroke-width': 1, visibility: 'hidden' }); svg.append(cross);
    const tip = h('div', { class: 'tip', hidden: true }), box = h('div', { class: 'chart' }, svg, tip);
    const move = (ev) => { const r = svg.getBoundingClientRect(), px = ((ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left) / r.width * W;
      const hr = Math.max(0, Math.min(nowH, Math.round((px - m.l) / (W - m.l - m.r) * H))); cross.setAttribute('x1', X(hr)); cross.setAttribute('x2', X(hr)); cross.setAttribute('visibility', 'visible');

      tip.replaceChildren(h('b', null, hourLabel(hr)), ...(rows.length ? rows.map((t) => h('div', { style: t.id === sel ? 'font-weight:700;color:#fff' : null }, h('i', { style: 'background:' + t.color }), h('span', null, t.name), h('span', null, fmt(t.cum[hr])))) : [h('div', null, 'ещё никто ничего не захватил')]));
      tip.hidden = false; const left = X(hr) / W * r.width; tip.style.left = (left > r.width / 2 ? Math.max(4, left - tip.offsetWidth - 12) : Math.min(r.width - tip.offsetWidth - 4, left + 12)) + 'px'; };

    svg.addEventListener('mousemove', move); svg.addEventListener('mouseleave', out); svg.addEventListener('touchstart', move, { passive: true }); svg.addEventListener('touchmove', move, { passive: true }); svg.addEventListener('touchend', () => setTimeout(out, 1800));

  }
  function chips() {
    const T = D.teams, shown = showAll ? T : T.filter((t, i) => i < 10 || t.id === sel);
    return h('div', { class: 'chips', role: 'group', 'aria-label': 'Выбор группы' }, ...shown.map((t) => h('button', { type: 'button', class: 'chip', 'aria-pressed': String(t.id === sel), onclick: () => { sel = t.id; draw(true); } }, h('i', { style: 'background:' + t.color }), t.name)),

  }
  // ---------- карточка группы: вся её игра за 5 дней ----------
  function teamCard() {
    const t = D.teams.find((x) => x.id === sel); if (!t) return null;
    const place = D.teams.indexOf(t) + 1, name = (id) => (D.teams.find((x) => x.id === id) || {}).name || '—';
    const sum = (k) => t.days.reduce((s, d) => s + (d[k] || 0), 0), moves = sum(2) + sum(3) + sum(4);
