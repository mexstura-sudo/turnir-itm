<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-title" content="Пульт турнира">
<meta name="format-detection" content="telephone=no">
<title>Пульт турнира ИТМ</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;600&family=IBM+Plex+Mono:wght@500;700&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#e6dcc0; --sheet:#fbf6e6; --ink:#2b2a22; --muted:#6f6a55; --line:#b9ad86; --cell:#e3ecd6;
  --accent:#ec6a1c; --accent-ink:#fff8ee; --blue:#20406a; --blue-soft:#f5dcc4; --ok:#2f8a46; --bad:#c2381f; --warn:#b7791f;
  --lcd-bg:#0e1d13; --lcd:#86f29a; --panel:#2f5a44;
  --font-display:"Pixelify Sans","IBM Plex Mono",monospace;
  --font-body:"IBM Plex Mono","PT Mono","Courier New",monospace;
  --font-mono:"IBM Plex Mono","PT Mono","Courier New",monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--font-body);background-image:linear-gradient(#d8ccaa 1px,transparent 1px),linear-gradient(90deg,#d8ccaa 1px,transparent 1px);background-size:28px 28px}
h1,h2{text-transform:uppercase;letter-spacing:.04em}
.stat{background:var(--lcd-bg)!important;color:var(--lcd);border:0!important}
.stat span{color:#bfe8c6!important}
.sheet{border:2px solid #8f8668!important;border-radius:10px!important;box-shadow:inset 2px 2px 0 #fffaf0,0 3px 0 rgba(0,0,0,.12)}
.btn{border:2px solid #b44b0d;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18),0 2px 0 #b44b0d;text-transform:uppercase;letter-spacing:.06em}
.btn.ghost{box-shadow:0 2px 0 #7d7660}
.wrap{max-width:1240px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
h1,h2{font-family:var(--font-display);font-weight:400;margin:0;text-wrap:balance}
h1{font-size:1.6rem} h2{font-size:1.15rem}
.eyebrow{font:600 .72rem/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.sheet{background:var(--sheet);border:1.5px solid var(--ink);border-radius:4px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.row>label{flex:1 1 200px}
label{display:flex;flex-direction:column;gap:5px;font-weight:600;font-size:.85rem}
input{font:inherit;font-size:16px;padding:10px 11px;border:1.5px solid var(--line);border-radius:7px;background:var(--sheet);color:var(--ink)}
.btn{font:600 .95rem var(--font-body);padding:11px 16px;border-radius:7px;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.danger{background:transparent;color:var(--bad);border:1.5px solid var(--bad);padding:5px 9px;font-size:.8rem}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{border:1px solid var(--line);border-radius:6px;padding:10px 12px;background:var(--sheet)}
.stat b{display:block;font:700 1.5rem var(--font-mono);font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--muted)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1.5px solid var(--ink)}
.tabs button{font:600 .9rem var(--font-body);padding:9px 14px;border:0;background:none;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1.5px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--cell);white-space:nowrap}
td.num{text-align:right;font-family:var(--font-mono);white-space:nowrap}
th.num{text-align:right}
td.act{white-space:nowrap;width:1%}
.fbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.fbar .cnt{margin-left:auto}
tr.top td{background:var(--blue-soft)}
.place{font:700 .85rem var(--font-mono)}
.pill{display:inline-block;font:600 .72rem var(--font-body);padding:2px 7px;border-radius:999px;border:1px solid currentColor}
.pill.done{color:var(--ok)} .pill.active{color:var(--warn)}
.dots{display:flex;gap:2px}
.dots i{width:9px;height:9px;border-radius:2px;background:var(--line)}
.dots i.ok{background:var(--ok)} .dots i.no{background:var(--bad);opacity:.55}
.err{color:var(--bad);font-weight:600}
.muted{color:var(--muted)} .small{font-size:.85rem}
.spec-block{display:flex;flex-direction:column;gap:6px}
.bar{height:8px;background:var(--cell);border-radius:2px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--blue)}
.confirm{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.gcode{font:700 1rem var(--font-mono);letter-spacing:.06em;user-select:all;-webkit-user-select:all;white-space:nowrap}
select{font:inherit;font-size:16px;padding:10px 11px;border-radius:7px;border:1.5px solid var(--line);background:#fff;color:var(--ink)}
input[type=search]{min-width:0}
/* коды на телефоне — карточками */
@media screen and (max-width:640px){
  table.codes thead{display:none}
  table.codes tr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:10px 2px;border-bottom:1px solid var(--line)}
  table.codes td{border:0;padding:0}
  table.codes .c-name{font-weight:600}
  table.codes .c-group{color:var(--muted);text-align:right}
  table.codes .c-code{grid-column:1/-1;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  table.codes .c-code .gcode{font-size:1.25rem}
  table.codes .c-seen{grid-column:1/-1}
}
@media print{
  body{background:#fff!important}
  body *{visibility:hidden}
  .printable,.printable *{visibility:visible}
  .printable{position:absolute;left:0;top:0;width:100%;overflow:visible}
  .noprint{display:none!important}
  th,td{color:#000!important;background:#fff!important;border-bottom:1px solid #999!important}
}
.pill.warn{color:#b44b0d;background:#fff1e6;margin-left:6px;vertical-align:1px}
.pill.twin{color:#1c4fd8;background:#e8efff;margin-left:6px;vertical-align:1px}
.dlg-back{position:fixed;inset:0;background:rgba(31,61,45,.55);display:grid;place-items:center;padding:16px;z-index:30}
.dlg{width:min(460px,100%);display:flex;flex-direction:column;gap:10px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="config.js"></script>
<script src="names.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function(){
'use strict';
const CFG = window.TOURNEY_CONFIG || {}, TZ = 'Asia/Irkutsk', LS = 'itm_admin_key';
const $ = document.getElementById('app');
const h = (tag, attrs, ...kids) => { const el = document.createElement(tag); if (attrs) for (const [k,v] of Object.entries(attrs)) { if (v==null||v===false) continue; if (k==='class') el.className=v; else if (k.startsWith('on')) el.addEventListener(k.slice(2),v); else el.setAttribute(k, v===true?'':v); } for (const c of kids.flat()) if (c!=null&&c!==false) el.append(c.nodeType?c:document.createTextNode(String(c))); return el; };
const ls = { get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}} };
const fmtDate = (d) => d ? new Date(d).toLocaleString('ru-RU',{timeZone:TZ,day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}) : '—';
const fmtMs = (ms) => { const s=Math.round(ms/1000); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); };
// datetime-local в иркутском времени ↔ ISO
const toLocal = (iso) => { const d = new Date(new Date(iso).getTime() + 8*3600e3); return d.toISOString().slice(0,16); };
const fromLocal = (v) => v + ':00+08:00';
const TPL = { e_units:'Единицы информации', e_ext:'Разбери файлы', e_bin:'Двоичные лампочки', e_pass:'Надёжность пароля', e_hotkeys:'Горячие клавиши', e_sms:'Найди мошенника', e_units_order:'Порядок единиц', e_input:'Ввод или вывод',
  sew_pixel:'Схема вышивки', sew_fabric:'Расчёт ткани', sew_order:'Алгоритм пошива', sew_rle:'Сжатие узора', sew_size:'Таблица размеров',
  auto_obd:'Коды OBD', auto_robot:'Заезд в бокс', auto_sensors:'Условие ИЛИ (датчики)', auto_cost:'Смета ремонта', auto_wheel:'Замена колеса',
  weld_table:'Режим сварки', weld_consume:'Расход электродов', weld_algo:'Блок-схема', weld_logic:'Блок безопасности', weld_order:'Подготовка к сварке',
  zhkh_graph:'Трасса трубопровода', zhkh_meter:'Счётчики воды', zhkh_requests:'Фильтр заявок', zhkh_robot:'Робот-диагност', zhkh_order:'Замена смесителя',
  it_hosts:'Маска подсети', it_dec2bin:'Байт из лампочек', it_ports:'Разъёмы', it_boot:'Загрузка ПК', it_graph:'Маршрут пакета', it_samenet:'Одна подсеть',
  cook_scale:'Пересчёт рецепта', cook_order:'Технологическая карта', cook_kcal:'Калорийность', cook_expiry:'Сроки хранения', cook_robot:'Робот-официант',
  b_maze:'Лабиринт', b_logic4:'Логическая схема', b_image:'Объём изображения', b_trace:'Трассировка', b_pixel_hex:'Шестнадцатеричный узор', b_countif:'Формула в таблице', b_graph:'Кратчайший маршрут' };

if (!CFG.supabaseUrl) { $.append(h('h1',null,'Пульт турнира'), h('div',{class:'sheet'}, h('p',null,'Заполните config.js адресом и ключом Supabase.'))); return; }
const sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseKey, { auth: { persistSession: false } });
const rpc = async (fn, args) => { const { data, error } = await sb.rpc(fn, args); if (error) throw new Error(error.message); return data; };

let KEY = ls.get(LS), DATA = null, TAB = 'students';

function login(msg){
  $.replaceChildren();
  const k = h('input',{type:'password',id:'f-key',autocomplete:'current-password',placeholder:'Ключ организатора'});
  const f = h('form',{class:'sheet'}, h('h2',null,'Вход организатора'), msg ? h('p',{class:'err'},msg) : null, h('div',{class:'row'}, h('label',null,'Ключ администратора', k), h('button',{class:'btn',type:'submit'},'Войти')));
  f.addEventListener('submit', (e)=>{ e.preventDefault(); KEY = k.value.trim(); load(); });
  $.append(h('h1',null,'Пульт турнира'), f); k.focus();
}

async function load(){
  try {
    const [res, codes, gst, bk] = await Promise.all([rpc('t_admin_results', { p_key: KEY }), rpc('g_admin_codes', { p_key: KEY }).catch(() => ({})), rpc('g_admin_state', { p_key: KEY }).catch(() => null), rpc('g_admin_backups', { p_key: KEY }).catch(() => null)]);
    DATA = res; DATA.game = codes || {}; DATA.gstate = gst; DATA.backups = bk; DATA.similar = similarNames(res.rows || []); ls.set(LS, KEY); render();
  }
  catch(e){ login(/BAD_KEY/.test(e.message) ? 'Неверный ключ.' : 'Нет связи с сервером: ' + e.message); }
}

const specName = (c) => (DATA.specialties.find(s=>s.code===c)||{}).name || c;
const done = () => DATA.rows.filter(r=>r.status==='done');

function render(){
  $.replaceChildren();
  const s = DATA.settings, now = new Date(s.now), st = new Date(s.starts_at), en = new Date(s.ends_at);
  const phase = now < st ? 'Ещё не начался' : now > en ? 'Завершён' : 'Идёт';
  const d = done(), students = d.filter(r=>!r.teacher), teachers = d.filter(r=>r.teacher);
  const avg = d.length ? Math.round(d.reduce((a,r)=>a+r.score,0)/d.length) : 0;
  $.append(
    h('div',{class:'row',style:'justify-content:space-between;align-items:center'},
      h('div',null, h('div',{class:'eyebrow'},'Пульт организатора · ' + phase), h('h1',null, s.title)),
      h('div',{class:'row'}, h('button',{class:'btn ghost',onclick:load},'Обновить'), h('button',{class:'btn',onclick:csv},'Скачать CSV'))),
    h('div',{class:'stats'},
      stat(DATA.rows.length,'попыток всего'), stat(students.length,'студентов завершили'), stat(teachers.length,'преподавателей завершили'),
      stat(DATA.rows.filter(r=>r.status==='active').length,'проходят сейчас'), stat(avg,'средний балл из 200')),
    winners(students, teachers),
    tabs());
  $.append(h('div',{class:'sheet'}, body()));
  $.append(settingsForm()); if (DATA.gstate) $.append(gameForm(), limitsForm()); if (DATA.backups) $.append(backupsView());
}
const stat = (v,l) => h('div',{class:'stat'}, h('b',null,String(v)), h('span',null,l));

function winners(students, teachers){
  const w = (label, r) => h('div',{class:'stat'}, h('span',null,label), h('b',{style:'font-size:1.05rem;font-family:var(--font-body)'}, r ? r.name : '—'), r ? h('span',null, (r.teacher?'':r.group+' · ') + r.score + ' б · ' + fmtMs(r.time_ms)) : null);
  return h('div',{class:'stats'}, w('🏆 Лучший студент', students[0]), w('🏆 Лучший преподаватель', teachers[0]));
}

function tabs(){
  const T = [['students','Студенты'],['teachers','Преподаватели'],['game','Игра'],['codes','Коды игры'],['specs','По специальностям'],['groups','По группам'],['tasks','Статистика заданий'],['all','Все попытки']];
  return h('div',{class:'tabs',role:'tablist'}, ...T.map(([k,l])=>h('button',{role:'tab','aria-selected':String(TAB===k),onclick:()=>{TAB=k;render();}},l)));
}

function rank(rows, opts={}){
  if (!rows.length) return h('p',{class:'muted'}, opts.empty || 'Пока нет результатов.');
  return h('div',{class:'tbl'}, h('table',null,
    h('thead',null, h('tr',null, h('th',null,'#'), h('th',null,'Участник'), opts.teacher?null:h('th',null,'Группа'), opts.spec?h('th',null,'Специальность'):null, h('th',{class:'num'},'Баллы'), h('th',{class:'num'},'Верно'), h('th',{class:'num'},'Время'), h('th',null,'Задания'), opts.status?h('th',null,'Статус'):null, opts.manage?h('th',null,''):null)),
    h('tbody',null, ...rows.map((r,i)=>{ const pl = r._pl || i+1; return h('tr',{class: !opts.status && pl<=3 ? 'top' : ''},
      h('td',{class:'place'}, String(pl)), h('td',null, r.name, suspicious(r.name) ? h('span',{class:'pill warn',title:'Похоже на кличку или ругательство — проверьте и переименуйте или удалите'},'проверьте') : null, DATA.similar && DATA.similar[r.id] ? h('span',{class:'pill twin',title:'В этой же группе: ' + DATA.similar[r.id].join(', ') + '. Возможно, один человек прошёл дважды — проверьте.'},'похожее имя') : null, h('div',{class:'small muted'}, fmtDate(r.finished_at||r.started_at))),
      opts.teacher?null:h('td',null,r.group), opts.spec?h('td',{class:'small'},specName(r.specialty)):null,
      h('td',{class:'num'},String(r.score)), h('td',{class:'num'},`${r.correct}/10`), h('td',{class:'num'},fmtMs(r.time_ms)),
      h('td',null, h('div',{class:'dots'}, ...(r.tasks||[]).map(t=>h('i',{class:t.ok===true?'ok':t.ok===false?'no':'',title:(TPL[t.tpl]||t.tpl)})))),
      opts.status?h('td',null,h('span',{class:'pill '+r.status}, r.status==='done'?'завершена':'идёт')):null,
      opts.manage?h('td',{class:'act'}, manage(r)):null); }))));
}
// ---------- поиск и фильтры на каждой вкладке (как в «Коды игры») ----------
const FLT = {};   // состояние фильтров по вкладкам — сохраняется при «Обновить»
const norm = (v) => String(v ?? '').toLowerCase().replace(/ё/g,'е');
const hit = (t, ...f) => !t || norm(f.join(' ')).includes(t);
const placed = (rows) => rows.map((r,i) => ({ ...r, _pl: i+1 }));
const opts1 = (list, key, label) => [...new Map(list.map(r => [key(r), label ? label(r) : key(r)])).entries()].filter(([v]) => v != null && v !== '').sort((a,b) => String(a[1]).localeCompare(String(b[1]), 'ru', {numeric:true}));
// key — вкладка; ph — подсказка поиска; selects — [{id, all, options:[[значение, подпись]]}];
// draw(t, s) → { el, n, total }: t — строка поиска (нижний регистр, ё→е), s — выбранные значения фильтров
function filtered(key, ph, selects, draw){
  const st = FLT[key] = FLT[key] || { q:'', s:{} };
  const box = h('div',{style:'display:flex;flex-direction:column;gap:14px;min-width:0'}), cnt = h('span',{class:'small muted cnt'});
  const q = h('input',{type:'search',placeholder:ph,value:st.q,autocomplete:'off','aria-label':'Поиск',style:'flex:1 1 220px'});
  const sels = selects.filter(x => x.options.length > 1).map(x => {
    const el = h('select',{style:'flex:0 1 200px','aria-label':x.all}, h('option',{value:''},x.all), ...x.options.map(([v,l]) => h('option',{value:String(v),selected:String(st.s[x.id] ?? '') === String(v)}, String(l))));
    el.addEventListener('change', () => { st.s[x.id] = el.value; fill(); }); return el; });
  const fill = () => { const r = draw(norm(st.q.trim()), st.s); box.replaceChildren(r.el); cnt.textContent = r.n == null ? '' : 'Показано: ' + r.n + (r.total != null && r.total !== r.n ? ' из ' + r.total : ''); };
  q.addEventListener('input', () => { st.q = q.value; fill(); });
  fill();
  return h('div',{style:'display:flex;flex-direction:column;gap:12px;min-width:0'}, h('div',{class:'fbar noprint'}, q, ...sels, cnt), box);
}
const NONE = 'Никого не нашлось — измените поиск или фильтр.';

// похожие имена в одной группе: та же фамилия и первая буква имени, одно имя — начало другого,
// или отличаются на 1–2 буквы (опечатка). Помогает заметить, что человек прошёл олимпиаду дважды.
function similarNames(rows){
  const norm = (n) => String(n||'').toLowerCase().replace(/ё/g,'е').replace(/[^а-яa-z\s-]/g,'').trim().split(/\s+/);
  const lev = (a, b) => { if (Math.abs(a.length - b.length) > 2) return 9; let p = Array.from({length:b.length+1},(_,i)=>i); for (let i=1;i<=a.length;i++){ const c=[i]; for (let j=1;j<=b.length;j++) c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1)); p=c; } return p[b.length]; };
  const out = {}, by = {};
  rows.forEach(r => { (by[r.teacher ? '*' : r.group] = by[r.teacher ? '*' : r.group] || []).push(r); });
  Object.values(by).forEach(list => {
    for (let i = 0; i < list.length; i++) for (let j = i + 1; j < list.length; j++) {
      const a = norm(list[i].name), b = norm(list[j].name), A = a.join(' '), B = b.join(' ');
      const like = (a[0] === b[0] && a[1] && b[1] && a[1][0] === b[1][0]) || A.startsWith(B + ' ') || B.startsWith(A + ' ') || lev(A, B) <= 2;
      if (!like) continue;
      (out[list[i].id] = out[list[i].id] || []).push(list[j].name); (out[list[j].id] = out[list[j].id] || []).push(list[i].name);
    }
  });
  return out;
}
const suspicious = (n) => !!(window.ITM_NAMES && window.ITM_NAMES.problem(n));
const NAME_ERR = { BAD_NAME:'Нужны минимум фамилия и имя.', NAME_RULES:'Только русские буквы, пробел и дефис.', ALREADY:'В этой группе уже есть участник с таким именем.', NOT_FOUND:'Участник уже удалён — обновите страницу.', BAD_KEY:'Ключ устарел — войдите заново.' };
const nameErr = (e) => { const m = String(e && e.message || e); for (const k in NAME_ERR) if (m.includes(k)) return NAME_ERR[k]; return 'Не получилось: ' + m; };
// кнопки в строке участника: переименовать и удалить
function manage(r){
  const box = h('div',{class:'confirm'});
  const small = 'padding:6px 10px;font-size:.8rem;min-height:34px';

          h('tbody',null, ...l.map(({r,pl})=>{ const days = r.days || [], total = r.total ?? r.score ?? 0, now = r.today ?? r.score ?? 0;
            return h('tr',{class:pl<=3&&total>0?'top':''}, h('td',{class:'place'},String(pl)), h('td',null,r.team), h('td',{class:'num'},h('b',null,String(total))),
              ...[1,2,3,4,5].map(d => h('td',{class:'num small'+(d===today?'':' muted')}, (d < today ? String(days[d-1] ?? 0) : d === today ? String(now) + ' ·' : '—') + (d === 4 && r.bounty ? ' +' + r.bounty + ' 🎯' : ''))),
              h('td',{class:'num'},String(r.nodes)), h('td',{class:'num'},String(r.players)),
              h('td',{class:'num'}, r.energy == null ? '—' : h('span',null, h('b',null,String(r.energy)), h('span',{class:'muted small'},' ('+(r.at_cap||0)+')')))); })))) : h('p',{class:'muted'},'Таких команд нет.'),
        h('p',{class:'small muted',style:'margin:0'},'Д1–Д5 — счёт, записанный за каждый день; «·» — сегодняшний день, счёт ещё меняется; 🎯 — награда за голову лидеров в четверг (уже в копилке). Энергия ⚡ — сколько сейчас у всех игроков команды вместе, в скобках — сколько игроков упёрлись в лимит.'),
        h('div',{class:'tbl'}, h('h2',null,'Лучшие взломщики'), tl.length ? h('table',null,
          h('thead',null,h('tr',null,h('th',null,'#'),h('th',null,'Игрок'),h('th',null,'Команда'),h('th',{class:'num'},'Захватов'))),
          h('tbody',null, ...tl.map(({r,pl})=>h('tr',null, h('td',{class:'place'},String(pl)), h('td',null,r.name), h('td',null,r.team), h('td',{class:'num'},String(r.captures))))))
          : h('p',{class:'muted small'}, top.length ? 'Никого не нашлось.' : 'Пока никто ничего не захватил.'))) }; }));
}

// ---------- Коды входа в игру ----------
let CODE_Q = '', CODE_G = '';
function codesView(d){
  const game = DATA.game || {};
  const rows = d.filter(r => r.game_code).map(r => ({ ...r, g: game[r.game_code] || null }))
    .sort((a, b) => (a.teacher - b.teacher) || a.group.localeCompare(b.group, 'ru') || a.name.localeCompare(b.name, 'ru'));
  const groups = [...new Set(rows.map(r => r.group))];
  const joined = rows.filter(r => r.g).length;
  const q = h('input',{type:'search',placeholder:'Фамилия, группа или код',value:CODE_Q,autocomplete:'off',style:'flex:1 1 220px'});
  const sel = h('select',{style:'flex:0 1 200px'}, h('option',{value:''},'Все группы'), ...groups.map(g => h('option',{value:g, selected:g===CODE_G}, g)));
  const tbody = h('tbody');
  const copy = async (code, btn) => {
    try { await navigator.clipboard.writeText(code); btn.textContent = 'Скопирован'; }
    catch(e){ btn.textContent = 'Выделите код'; }
    setTimeout(() => { btn.textContent = 'Копировать'; }, 1600);
  };
  const seen = (g) => g ? (g.last_seen ? 'заходил ' + fmtDate(g.last_seen) : 'вошёл') + (g.captures ? ' · захватов: ' + g.captures : '') : 'ещё не входил';
  const fill = () => {
    const t = CODE_Q.trim().toLowerCase().replace(/ё/g,'е');
    const list = rows.filter(r => (!CODE_G || r.group === CODE_G) && (!t || (r.name + ' ' + r.group + ' ' + r.game_code).toLowerCase().replace(/ё/g,'е').includes(t)));
    tbody.replaceChildren(...(list.length ? list.map(r => h('tr', null,
      h('td', {class:'c-name'}, r.name),
      h('td', {class:'c-group'}, r.teacher ? 'Преподаватель' : r.group),
      h('td', {class:'c-code'}, h('span',{class:'gcode'}, r.game_code), ' ', h('button',{class:'btn ghost noprint',style:'padding:5px 9px;font-size:.78rem;min-height:32px',onclick:(e)=>copy(r.game_code, e.currentTarget)},'Копировать')),
      h('td', {class:'c-seen small' + (r.g ? '' : ' muted')}, (r.g ? '✓ ' : '') + seen(r.g))))
      : [h('tr', null, h('td',{colspan:'4',class:'muted'},'Никого не нашлось.'))]));
  };
  q.addEventListener('input', () => { CODE_Q = q.value; fill(); });
  sel.addEventListener('change', () => { CODE_G = sel.value; fill(); });
  fill();
  return h('div',{style:'display:flex;flex-direction:column;gap:10px'},
    h('p',{class:'small muted',style:'margin:0'}, 'Код выдаётся после олимпиады. Если участник его потерял — найдите здесь и продиктуйте. Вошли в игру: ' + joined + ' из ' + rows.length + '.'),
    h('div',{class:'row noprint',style:'flex-wrap:wrap'}, q, sel, h('button',{class:'btn ghost',onclick:()=>window.print()},'Распечатать')),
    h('div',{class:'tbl printable'}, h('table', {class:'codes'},
      h('thead', null, h('tr', null, h('th',null,'Участник'), h('th',null,'Группа'), h('th',null,'Код игры'), h('th',null,'В игре'))),
      tbody)));
}

function csv(){
  const q = (v) => '"' + String(v ?? '').replace(/"/g,'""') + '"';
  const head = ['Место','ФИО','Группа','Специальность','Преподаватель','Статус','Баллы','Верно','Время (мин:сек)','Начал','Закончил','Код игры', ...Array.from({length:10},(_,i)=>'Задание '+(i+1))];
  const lines = [head.map(q).join(';')];
  DATA.rows.forEach((r,i)=> lines.push([i+1, r.name, r.group, specName(r.specialty), r.teacher?'да':'', r.status==='done'?'завершена':'идёт', r.score, r.correct, fmtMs(r.time_ms), fmtDate(r.started_at), fmtDate(r.finished_at), r.game_code||'', ...(r.tasks||[]).map(t=>(TPL[t.tpl]||t.tpl)+': '+(t.ok?'верно':'нет'))].map(q).join(';')));
  const blob = new Blob(['﻿' + lines.join('\r\n')], { type:'text/csv;charset=utf-8' });
  const a = h('a',{href:URL.createObjectURL(blob),download:'turnir-rezultaty.csv'}); document.body.append(a); a.click(); a.remove();
}

KEY ? load() : login();
