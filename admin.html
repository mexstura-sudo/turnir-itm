<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-title" content="Пульт турнира">
<meta name="format-detection" content="telephone=no">
<title>Пульт турнира ИТМ</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;600&family=IBM+Plex+Mono:wght@500;700&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#e6dcc0; --sheet:#fbf6e6; --ink:#2b2a22; --muted:#6f6a55; --line:#b9ad86; --cell:#e3ecd6;
  --accent:#ec6a1c; --accent-ink:#fff8ee; --blue:#20406a; --blue-soft:#f5dcc4; --ok:#2f8a46; --bad:#c2381f; --warn:#b7791f;
  --lcd-bg:#0e1d13; --lcd:#86f29a; --panel:#2f5a44;
  --font-display:"Pixelify Sans","IBM Plex Mono",monospace;
  --font-body:"IBM Plex Mono","PT Mono","Courier New",monospace;
  --font-mono:"IBM Plex Mono","PT Mono","Courier New",monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--font-body);background-image:linear-gradient(#d8ccaa 1px,transparent 1px),linear-gradient(90deg,#d8ccaa 1px,transparent 1px);background-size:28px 28px}
h1,h2{text-transform:uppercase;letter-spacing:.04em}
.stat{background:var(--lcd-bg)!important;color:var(--lcd);border:0!important}
.stat span{color:#bfe8c6!important}
.sheet{border:2px solid #8f8668!important;border-radius:10px!important;box-shadow:inset 2px 2px 0 #fffaf0,0 3px 0 rgba(0,0,0,.12)}
.btn{border:2px solid #b44b0d;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18),0 2px 0 #b44b0d;text-transform:uppercase;letter-spacing:.06em}
.btn.ghost{box-shadow:0 2px 0 #7d7660}
.wrap{max-width:1100px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
h1,h2{font-family:var(--font-display);font-weight:400;margin:0;text-wrap:balance}
h1{font-size:1.6rem} h2{font-size:1.15rem}
.eyebrow{font:600 .72rem/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.sheet{background:var(--sheet);border:1.5px solid var(--ink);border-radius:4px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.row>label{flex:1 1 200px}
label{display:flex;flex-direction:column;gap:5px;font-weight:600;font-size:.85rem}
input{font:inherit;font-size:16px;padding:10px 11px;border:1.5px solid var(--line);border-radius:7px;background:var(--sheet);color:var(--ink)}
.btn{font:600 .95rem var(--font-body);padding:11px 16px;border-radius:7px;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.danger{background:transparent;color:var(--bad);border:1.5px solid var(--bad);padding:5px 9px;font-size:.8rem}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{border:1px solid var(--line);border-radius:6px;padding:10px 12px;background:var(--sheet)}
.stat b{display:block;font:700 1.5rem var(--font-mono);font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--muted)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1.5px solid var(--ink)}
.tabs button{font:600 .9rem var(--font-body);padding:9px 14px;border:0;background:none;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1.5px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--cell);white-space:nowrap}
td.num{text-align:right;font-family:var(--font-mono);white-space:nowrap}
tr.top td{background:var(--blue-soft)}
.place{font:700 .85rem var(--font-mono)}
.pill{display:inline-block;font:600 .72rem var(--font-body);padding:2px 7px;border-radius:999px;border:1px solid currentColor}
.pill.done{color:var(--ok)} .pill.active{color:var(--warn)}
.dots{display:flex;gap:2px}
.dots i{width:9px;height:9px;border-radius:2px;background:var(--line)}
.dots i.ok{background:var(--ok)} .dots i.no{background:var(--bad);opacity:.55}
.err{color:var(--bad);font-weight:600}
.muted{color:var(--muted)} .small{font-size:.85rem}
.spec-block{display:flex;flex-direction:column;gap:6px}
.bar{height:8px;background:var(--cell);border-radius:2px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--blue)}
.confirm{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function(){
'use strict';
const CFG = window.TOURNEY_CONFIG || {}, TZ = 'Asia/Irkutsk', LS = 'itm_admin_key';
const $ = document.getElementById('app');
const h = (tag, attrs, ...kids) => { const el = document.createElement(tag); if (attrs) for (const [k,v] of Object.entries(attrs)) { if (v==null||v===false) continue; if (k==='class') el.className=v; else if (k.startsWith('on')) el.addEventListener(k.slice(2),v); else el.setAttribute(k, v===true?'':v); } for (const c of kids.flat()) if (c!=null&&c!==false) el.append(c.nodeType?c:document.createTextNode(String(c))); return el; };
const ls = { get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}} };
const fmtDate = (d) => d ? new Date(d).toLocaleString('ru-RU',{timeZone:TZ,day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}) : '—';
const fmtMs = (ms) => { const s=Math.round(ms/1000); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); };
// datetime-local в иркутском времени ↔ ISO
const toLocal = (iso) => { const d = new Date(new Date(iso).getTime() + 8*3600e3); return d.toISOString().slice(0,16); };
const fromLocal = (v) => v + ':00+08:00';
const TPL = { e_units:'Единицы информации', e_ext:'Разбери файлы', e_bin:'Двоичные лампочки', e_pass:'Надёжность пароля', e_hotkeys:'Горячие клавиши', e_sms:'Найди мошенника', e_units_order:'Порядок единиц', e_input:'Ввод или вывод',
  sew_pixel:'Схема вышивки', sew_fabric:'Расчёт ткани', sew_order:'Алгоритм пошива', sew_rle:'Сжатие узора', sew_size:'Таблица размеров',
  auto_obd:'Коды OBD', auto_robot:'Заезд в бокс', auto_sensors:'Условие ИЛИ (датчики)', auto_cost:'Смета ремонта', auto_wheel:'Замена колеса',
  weld_table:'Режим сварки', weld_consume:'Расход электродов', weld_algo:'Блок-схема', weld_logic:'Блок безопасности', weld_order:'Подготовка к сварке',
  zhkh_graph:'Трасса трубопровода', zhkh_meter:'Счётчики воды', zhkh_requests:'Фильтр заявок', zhkh_robot:'Робот-диагност', zhkh_order:'Замена смесителя',
  it_hosts:'Маска подсети', it_dec2bin:'Байт из лампочек', it_ports:'Разъёмы', it_boot:'Загрузка ПК', it_graph:'Маршрут пакета', it_samenet:'Одна подсеть',
  cook_scale:'Пересчёт рецепта', cook_order:'Технологическая карта', cook_kcal:'Калорийность', cook_expiry:'Сроки хранения', cook_robot:'Робот-официант',
  b_maze:'Лабиринт', b_logic4:'Логическая схема', b_image:'Объём изображения', b_trace:'Трассировка', b_pixel_hex:'Шестнадцатеричный узор', b_countif:'Формула в таблице', b_graph:'Кратчайший маршрут' };

if (!CFG.supabaseUrl) { $.append(h('h1',null,'Пульт турнира'), h('div',{class:'sheet'}, h('p',null,'Заполните config.js адресом и ключом Supabase.'))); return; }
const sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseKey, { auth: { persistSession: false } });
const rpc = async (fn, args) => { const { data, error } = await sb.rpc(fn, args); if (error) throw new Error(error.message); return data; };

let KEY = ls.get(LS), DATA = null, TAB = 'students';

function login(msg){
  $.replaceChildren();
  const k = h('input',{type:'password',id:'f-key',autocomplete:'current-password',placeholder:'Ключ организатора'});
  const f = h('form',{class:'sheet'}, h('h2',null,'Вход организатора'), msg ? h('p',{class:'err'},msg) : null, h('div',{class:'row'}, h('label',null,'Ключ администратора', k), h('button',{class:'btn',type:'submit'},'Войти')));
  f.addEventListener('submit', (e)=>{ e.preventDefault(); KEY = k.value.trim(); load(); });
  $.append(h('h1',null,'Пульт турнира'), f); k.focus();
}

async function load(){
  try { DATA = await rpc('t_admin_results', { p_key: KEY }); ls.set(LS, KEY); render(); }
  catch(e){ login(/BAD_KEY/.test(e.message) ? 'Неверный ключ.' : 'Нет связи с сервером: ' + e.message); }
}

const specName = (c) => (DATA.specialties.find(s=>s.code===c)||{}).name || c;
const done = () => DATA.rows.filter(r=>r.status==='done');

function render(){
  $.replaceChildren();
  const s = DATA.settings, now = new Date(s.now), st = new Date(s.starts_at), en = new Date(s.ends_at);
  const phase = now < st ? 'Ещё не начался' : now > en ? 'Завершён' : 'Идёт';
  const d = done(), students = d.filter(r=>!r.teacher), teachers = d.filter(r=>r.teacher);
  const avg = d.length ? Math.round(d.reduce((a,r)=>a+r.score,0)/d.length) : 0;
  $.append(
    h('div',{class:'row',style:'justify-content:space-between;align-items:center'},
      h('div',null, h('div',{class:'eyebrow'},'Пульт организатора · ' + phase), h('h1',null, s.title)),
      h('div',{class:'row'}, h('button',{class:'btn ghost',onclick:load},'Обновить'), h('button',{class:'btn',onclick:csv},'Скачать CSV'))),
    h('div',{class:'stats'},
      stat(DATA.rows.length,'попыток всего'), stat(students.length,'студентов завершили'), stat(teachers.length,'преподавателей завершили'),
      stat(DATA.rows.filter(r=>r.status==='active').length,'проходят сейчас'), stat(avg,'средний балл из 200')),
    winners(students, teachers),
    tabs());
  $.append(h('div',{class:'sheet'}, body()));
  $.append(settingsForm());
}
const stat = (v,l) => h('div',{class:'stat'}, h('b',null,String(v)), h('span',null,l));

function winners(students, teachers){
  const w = (label, r) => h('div',{class:'stat'}, h('span',null,label), h('b',{style:'font-size:1.05rem;font-family:var(--font-body)'}, r ? r.name : '—'), r ? h('span',null, (r.teacher?'':r.group+' · ') + r.score + ' б · ' + fmtMs(r.time_ms)) : null);
  return h('div',{class:'stats'}, w('🏆 Лучший студент', students[0]), w('🏆 Лучший преподаватель', teachers[0]));
}

function tabs(){
  const T = [['students','Студенты'],['teachers','Преподаватели'],['specs','По специальностям'],['groups','По группам'],['tasks','Статистика заданий'],['all','Все попытки']];
  return h('div',{class:'tabs',role:'tablist'}, ...T.map(([k,l])=>h('button',{role:'tab','aria-selected':String(TAB===k),onclick:()=>{TAB=k;render();}},l)));
}

function rank(rows, opts={}){
  if (!rows.length) return h('p',{class:'muted'},'Пока нет результатов.');
  return h('div',{class:'tbl'}, h('table',null,
    h('thead',null, h('tr',null, h('th',null,'#'), h('th',null,'Участник'), opts.teacher?null:h('th',null,'Группа'), opts.spec?h('th',null,'Специальность'):null, h('th',null,'Баллы'), h('th',null,'Верно'), h('th',null,'Время'), h('th',null,'Задания'), opts.status?h('th',null,'Статус'):null, opts.del?h('th',null,''):null)),
    h('tbody',null, ...rows.map((r,i)=>h('tr',{class: !opts.status && i<3 ? 'top' : ''},
      h('td',{class:'place'}, String(i+1)), h('td',null, r.name, h('div',{class:'small muted'}, fmtDate(r.finished_at||r.started_at))),
      opts.teacher?null:h('td',null,r.group), opts.spec?h('td',{class:'small'},specName(r.specialty)):null,
      h('td',{class:'num'},String(r.score)), h('td',{class:'num'},`${r.correct}/10`), h('td',{class:'num'},fmtMs(r.time_ms)),
      h('td',null, h('div',{class:'dots'}, ...(r.tasks||[]).map(t=>h('i',{class:t.ok===true?'ok':t.ok===false?'no':'',title:(TPL[t.tpl]||t.tpl)})))),
      opts.status?h('td',null,h('span',{class:'pill '+r.status}, r.status==='done'?'завершена':'идёт')):null,
      opts.del?h('td',null, delBtn(r)):null)))));
}

function delBtn(r){
  const box = h('div',{class:'confirm'});
  const ask = () => box.replaceChildren(h('span',{class:'small'},'Удалить попытку? Участник сможет пройти заново.'), h('button',{class:'btn danger',onclick:async()=>{ try{ await rpc('t_admin_delete',{p_key:KEY,p_id:r.id}); load(); }catch(e){ box.replaceChildren(h('span',{class:'err small'},e.message)); } }},'Удалить'), h('button',{class:'btn ghost',style:'padding:5px 9px;font-size:.8rem',onclick:reset},'Отмена'));
  const reset = () => box.replaceChildren(h('button',{class:'btn danger',onclick:ask},'Удалить'));
  reset(); return box;
}

function body(){
  const d = done();
  if (TAB==='students') return rank(d.filter(r=>!r.teacher), {spec:true});
  if (TAB==='teachers') return rank(d.filter(r=>r.teacher), {teacher:true});
  if (TAB==='all') return h('div',{style:'display:flex;flex-direction:column;gap:8px'}, h('p',{class:'small muted',style:'margin:0'},'Удаляйте попытку только при технической проблеме (например, участник ошибся в ФИО или пропал интернет).'), rank(DATA.rows, {spec:true,status:true,del:true}));
  if (TAB==='specs') {
    const st = d.filter(r=>!r.teacher);
    const codes = DATA.specialties.map(s=>s.code).filter(c=>c!=='teacher');
    return h('div',{style:'display:flex;flex-direction:column;gap:18px'}, ...codes.map(c=>{ const rows = st.filter(r=>r.specialty===c); return h('div',{class:'spec-block'}, h('h2',null, specName(c), h('span',{class:'muted small',style:'font-family:var(--font-body)'},' · '+rows.length+' уч.')), rank(rows.slice(0,10))); }));
  }
  if (TAB==='groups') {
    const st = d.filter(r=>!r.teacher);
    const rows = (DATA.groups||[]).map(g => { const rs = st.filter(r=>r.group===g.name); return { g, n: rs.length, avg: rs.length ? Math.round(rs.reduce((a,r)=>a+r.score,0)/rs.length) : 0, best: rs[0] }; }).sort((a,b)=> b.n - a.n || b.avg - a.avg);
    return h('div',{class:'tbl'}, h('p',{class:'small muted'},'Сколько человек из каждой группы прошли турнир — удобно напоминать кураторам.'), h('table',null,
      h('thead',null,h('tr',null,h('th',null,'Группа'),h('th',null,'Курс'),h('th',null,'Прошли'),h('th',null,'Средний балл'),h('th',null,'Лучший'))),
      h('tbody',null, ...rows.map(x=>h('tr',null, h('td',null,x.g.name), h('td',{class:'num'},String(x.g.course)), h('td',{class:'num'},String(x.n)), h('td',{class:'num'}, x.n?String(x.avg):'—'), h('td',null, x.best ? x.best.name + ' · ' + x.best.score : '—'))))));
  }
  if (TAB==='tasks') {
    const agg = {};
    d.forEach(r => (r.tasks||[]).forEach(t => { const a = agg[t.tpl] = agg[t.tpl] || { n:0, ok:0, pool:t.pool }; a.n++; if (t.ok) a.ok++; }));
    const rows = Object.entries(agg).sort((a,b)=> (a[1].ok/a[1].n) - (b[1].ok/b[1].n));
    if (!rows.length) return h('p',{class:'muted'},'Пока нет данных.');
    const lvl = { easy:'⭐', medium:'⭐⭐', boss:'⭐⭐⭐' };
    return h('div',{class:'tbl'}, h('p',{class:'small muted'},'Сверху — самые трудные задания. Помогает понять, какие темы повторить на занятиях.'), h('table',null,
      h('thead',null,h('tr',null,h('th',null,'Задание'),h('th',null,'Уровень'),h('th',null,'Выдано'),h('th',null,'Решили'),h('th',null,''))),
      h('tbody',null, ...rows.map(([k,a])=>{ const p = Math.round(a.ok/a.n*100); return h('tr',null, h('td',null,TPL[k]||k), h('td',null,lvl[a.pool]), h('td',{class:'num'},String(a.n)), h('td',{class:'num'},p+'%'), h('td',null,h('div',{class:'bar'},h('i',{style:`width:${p}%`})))); }))));
  }
}

function settingsForm(){
  const s = DATA.settings;
  const t = h('input',{id:'f-title',value:s.title}), a = h('input',{id:'f-start',type:'datetime-local',value:toLocal(s.starts_at)}), b = h('input',{id:'f-end',type:'datetime-local',value:toLocal(s.ends_at)});
  const msg = h('p',{class:'small',hidden:true});
  const f = h('form',{class:'sheet'}, h('h2',null,'Настройки турнира'), h('p',{class:'small muted',style:'margin:0'},'Время — иркутское.'),
    h('div',{class:'row'}, h('label',null,'Название', t), h('label',null,'Старт', a), h('label',null,'Финиш', b), h('button',{class:'btn',type:'submit'},'Сохранить')), msg);
  f.addEventListener('submit', async (e)=>{ e.preventDefault(); msg.hidden=false; msg.className='small';
    try { await rpc('t_admin_settings',{p_key:KEY,p_title:t.value,p_starts:fromLocal(a.value),p_ends:fromLocal(b.value)}); msg.textContent='Сохранено.'; setTimeout(load, 600); }
    catch(err){ msg.className='small err'; msg.textContent = /BAD_DATES/.test(err.message) ? 'Финиш должен быть позже старта.' : err.message; } });
  return f;
}

function csv(){
  const q = (v) => '"' + String(v ?? '').replace(/"/g,'""') + '"';
  const head = ['Место','ФИО','Группа','Специальность','Преподаватель','Статус','Баллы','Верно','Время (мин:сек)','Начал','Закончил', ...Array.from({length:10},(_,i)=>'Задание '+(i+1))];
  const lines = [head.map(q).join(';')];
  DATA.rows.forEach((r,i)=> lines.push([i+1, r.name, r.group, specName(r.specialty), r.teacher?'да':'', r.status==='done'?'завершена':'идёт', r.score, r.correct, fmtMs(r.time_ms), fmtDate(r.started_at), fmtDate(r.finished_at), ...(r.tasks||[]).map(t=>(TPL[t.tpl]||t.tpl)+': '+(t.ok?'верно':'нет'))].map(q).join(';')));
  const blob = new Blob(['﻿' + lines.join('\r\n')], { type:'text/csv;charset=utf-8' });
  const a = h('a',{href:URL.createObjectURL(blob),download:'turnir-rezultaty.csv'}); document.body.append(a); a.click(); a.remove();
}

KEY ? load() : login();
})();
</script>
</body>
</html>
